name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,  target: x86_64-pc-windows-msvc,   name: windows-x64 }
          - { os: windows-11-arm,  target: aarch64-pc-windows-msvc,  name: windows-arm64 }
          - { os: ubuntu-latest,   target: x86_64-unknown-linux-gnu, name: linux-x64 }
          - { os: macos-latest,    target: aarch64-apple-darwin,     name: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux-Bibliotheken für die GUI
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Bauen
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Paketieren
        shell: pwsh
        run: |
          $ext = if ($IsWindows) { ".exe" } else { "" }
          $rel = "target/${{ matrix.target }}/release"
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item "$rel/cryptool$ext", "$rel/cryptool-gui$ext", "README.md" dist/
          $zip = "cryptool-${{ github.ref_name }}-${{ matrix.name }}.zip"
          Compress-Archive -Path dist/* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File "$zip.sha256" -Encoding ascii

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            cryptool-*.zip
            cryptool-*.zip.sha256