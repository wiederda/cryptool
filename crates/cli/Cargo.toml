[package]
name = "cryptool-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "cryptool"
path = "src/main.rs"

[dependencies]
cryptool-lib = { path = "../lib" }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
rpassword = "7"
zeroize = "1"
